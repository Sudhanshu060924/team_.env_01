# Alembic configuration — VidyaRoom backend
# Run migrations from the `backend/` directory:
#
#   alembic current
#   alembic history
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "describe the change"

[alembic]
# Path to migration scripts (relative to this file's directory, i.e. backend/)
script_location = alembic

# Template for new migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used for generated file names.
timezone = UTC

# Truncate the slug to this many characters.
truncate_slug_length = 40

# Disable the legacy [loggers] block — logging is handled by Python's logging module.
prepend_sys_path = .

# Leave sqlalchemy.url blank here; env.py reads DATABASE_URL from the environment.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks needed.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
